
name: Deploy Bunny Scripting Script

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  update-script:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Install
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Publish the script to Bunny
        uses: BunnyWay/actions/deploy-script@main
        with:
          script_id: 103960
          file: index.ts
